name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["poetry"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag} != v{version}"
          print("version:", version)
          PY

      - name: Cache yun SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/yunpyopt/sdk
          key: yun-sdk-${{ hashFiles('yun-sdk-version.txt') }}
          restore-keys: |
            yun-sdk-

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine wheel

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Fix wheel platform tag
        run: python scripts/fix_wheel_tag.py dist

      - name: Validate wheel
        run: |
          twine check dist/*
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          assert "-cp311-cp311-macosx_14_0_arm64.whl" in wheel, wheel
          names = zipfile.ZipFile(wheel).namelist()
          sos = [name for name in names if name.endswith(".so")]
          assert len(sos) == 1, sos
          print("wheel ok:", wheel)
          PY

      - name: Smoke test wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --no-cache-dir dist/*.whl
          rm -rf /tmp/c1_2_1
          cp -R tests/data/c1_2_1 /tmp/c1_2_1
          rm -rf /tmp/c1_2_1/output
          /tmp/wheel-venv/bin/python - <<'PY'
          from pathlib import Path
          from yunpyopt import __version__, solve
          result = solve("/tmp/c1_2_1", log_level="warning")
          assert result["loads"] and Path(result["loads"]).is_file(), result
          print("version:", __version__)
          print(result)
          PY

      - name: Check dynamic dependencies and RPATH
        run: |
          rm -rf /tmp/whl && mkdir /tmp/whl
          unzip -q dist/*.whl -d /tmp/whl
          so=$(ls /tmp/whl/yunpyopt/_core*.so)
          bad=$(otool -L "$so" | tail -n +2 | grep -v -E '(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then echo "非系统依赖:"; echo "$bad"; exit 1; fi
          if otool -l "$so" | grep -q LC_RPATH; then echo "存在 LC_RPATH"; exit 1; fi
          echo "dylib deps ok"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
