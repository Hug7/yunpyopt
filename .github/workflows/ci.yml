name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ensure build artifacts are not committed
        run: |
          if git ls-files --error-unmatch 'src/yunpyopt/_core.*' 2>/dev/null; then
            echo "src/yunpyopt/_core.* must not be committed"; exit 1
          fi
          if git ls-files --error-unmatch src/yunpyopt/_build_info.py 2>/dev/null; then
            echo "src/yunpyopt/_build_info.py must not be committed"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./.github/actions/setup-poetry

      - name: Install dependencies (without building the extension)
        run: poetry install --no-root --no-interaction

      - name: Ruff
        run: |
          poetry run ruff check src tests scripts
          poetry run ruff format --check src tests scripts

      - name: Mypy
        run: poetry run mypy src

      - name: Lockfile check
        run: poetry check --lock

  test-macos:
    name: Build & test (macos-arm64)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine wheel

      - uses: ./.github/actions/build-wheel
        with:
          artifact-name: wheel-macos-arm64

      - name: Test installed wheel
        shell: bash
        env:
          YUNPYOPT_REQUIRE_CORE: "1"
        run: |
          python -m venv .venv-test
          VENV_PY=.venv-test/bin/python
          if [ -x .venv-test/Scripts/python.exe ]; then VENV_PY=.venv-test/Scripts/python.exe; fi
          "$VENV_PY" -m pip install --no-cache-dir dist/*.whl pytest
          "$VENV_PY" -m pytest -o pythonpath= tests -v

  test-linux:
    name: Build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and build deps
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-14/enable
          PY=/opt/python/cp311-cp311/bin/python
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install build twine wheel auditwheel pytest
          dirname "$PY" >> "$GITHUB_PATH"
          dirname "$(command -v g++)" >> "$GITHUB_PATH"
          echo "CC=$(command -v gcc)" >> "$GITHUB_ENV"
          echo "CXX=$(command -v g++)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/build-wheel
        with:
          artifact-name: wheel-${{ matrix.name }}

      - name: Test installed wheel
        shell: bash
        env:
          YUNPYOPT_REQUIRE_CORE: "1"
        run: |
          python -m venv .venv-test
          VENV_PY=.venv-test/bin/python
          if [ -x .venv-test/Scripts/python.exe ]; then VENV_PY=.venv-test/Scripts/python.exe; fi
          "$VENV_PY" -m pip install --no-cache-dir dist/*.whl pytest
          "$VENV_PY" -m pytest -o pythonpath= tests -v

  test-windows:
    name: Build & test (windows-x86_64)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64

      - name: Install LLVM / Ninja / build tools
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang-cl.exe")) {
            choco install llvm -y --no-progress
          }
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          python -m pip install --upgrade pip
          python -m pip install ninja build twine wheel

      - uses: ./.github/actions/build-wheel
        with:
          artifact-name: wheel-windows-x86_64

      - name: Test installed wheel
        shell: bash
        env:
          YUNPYOPT_REQUIRE_CORE: "1"
        run: |
          python -m venv .venv-test
          VENV_PY=.venv-test/bin/python
          if [ -x .venv-test/Scripts/python.exe ]; then VENV_PY=.venv-test/Scripts/python.exe; fi
          "$VENV_PY" -m pip install --no-cache-dir dist/*.whl pytest
          "$VENV_PY" -m pytest -o pythonpath= tests -v
