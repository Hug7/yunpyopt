name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & typecheck
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ensure extension is not committed
        run: |
          if git ls-files --error-unmatch src/yunpyopt/_core*.so 2>/dev/null; then
            echo "src/yunpyopt/_core*.so must not be committed"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./.github/actions/setup-poetry

      - name: Install dependencies (without building the extension)
        run: poetry install --no-root --no-interaction

      - name: Ruff
        run: |
          poetry run ruff check src tests scripts
          poetry run ruff format --check src tests scripts

      - name: Mypy
        run: poetry run mypy src

      - name: Lockfile check
        run: poetry check --lock

  test:
    name: Build & test wheel
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      POETRY_VIRTUALENVS_CREATE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine wheel

      - uses: ./.github/actions/setup-poetry

      # 先构建 wheel：该 action 会恢复 yun SDK 缓存，随后的 poetry install 可直接复用。
      - uses: ./.github/actions/build-wheel

      - name: Install project (builds yunpyopt._core)
        run: poetry install --no-interaction

      - name: Test
        env:
          YUNPYOPT_REQUIRE_CORE: "1"
        run: poetry run pytest -v
