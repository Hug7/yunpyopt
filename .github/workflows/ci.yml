name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & typecheck
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry

      - name: Ensure extension is not committed
        run: |
          if git ls-files --error-unmatch src/yunpyopt/_core*.so 2>/dev/null; then
            echo "src/yunpyopt/_core*.so must not be committed"; exit 1
          fi

      - name: Install Poetry
        run: python -m pip install "poetry==2.5.1"

      - name: Install dependencies (without building the extension)
        run: poetry install --no-root --no-interaction

      - name: Ruff
        run: |
          poetry run ruff check src tests scripts
          poetry run ruff format --check src tests scripts

      - name: Mypy
        run: poetry run mypy src

      - name: Lockfile check
        run: poetry check --lock

  test:
    name: Build & test wheel
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      POETRY_VIRTUALENVS_CREATE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry

      - name: Cache yun SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/yunpyopt/sdk
          key: yun-sdk-${{ hashFiles('yun-sdk-version.txt') }}
          restore-keys: |
            yun-sdk-

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.5.1" build twine wheel

      - name: Install project (builds yunpyopt._core)
        run: poetry install --no-interaction

      - name: Test
        env:
          YUNPYOPT_REQUIRE_CORE: "1"
        run: poetry run pytest -v

      - name: Build wheel
        run: poetry build -f wheel

      - name: Fix wheel platform tag
        run: poetry run python scripts/fix_wheel_tag.py dist

      - name: Validate wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          assert "-cp311-cp311-macosx_14_0_arm64.whl" in wheel, wheel
          names = zipfile.ZipFile(wheel).namelist()
          sos = [name for name in names if name.endswith(".so")]
          assert len(sos) == 1, sos
          assert sos[0].startswith("yunpyopt/_core."), sos
          print("wheel ok:", wheel)
          PY
          twine check dist/*

      - name: Smoke test wheel in clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --no-cache-dir dist/*.whl
          rm -rf /tmp/c1_2_1
          cp -R tests/data/c1_2_1 /tmp/c1_2_1
          rm -rf /tmp/c1_2_1/output
          /tmp/wheel-venv/bin/python - <<'PY'
          from pathlib import Path
          from yunpyopt import __version__, solve
          result = solve("/tmp/c1_2_1", log_level="warning")
          assert result["loads"] and Path(result["loads"]).is_file(), result
          print("version:", __version__)
          print(result)
          PY

      - name: Check dynamic dependencies and RPATH
        run: |
          rm -rf /tmp/whl && mkdir /tmp/whl
          unzip -q dist/*.whl -d /tmp/whl
          so=$(ls /tmp/whl/yunpyopt/_core*.so)
          bad=$(otool -L "$so" | tail -n +2 | grep -v -E '(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then echo "非系统依赖:"; echo "$bad"; exit 1; fi
          if otool -l "$so" | grep -q LC_RPATH; then echo "存在 LC_RPATH"; exit 1; fi
          echo "dylib deps ok"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
