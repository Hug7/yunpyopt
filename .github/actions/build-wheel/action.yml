name: Build and verify wheel
description: 缓存 yun SDK、构建 wheel、按平台修正标签、校验内容、冒烟求解、检查动态依赖并上传 artifact

inputs:
  artifact-name:
    description: 上传的 artifact 名称
    required: false
    default: wheel

runs:
  using: composite
  steps:
    - name: Cache yun SDK
      if: runner.os != 'Linux'
      uses: actions/cache@v4
      with:
        path: ~/.cache/yunpyopt/sdk
        key: yun-sdk-${{ hashFiles('yun-sdk-version.txt') }}-${{ runner.os }}-${{ runner.arch }}
        restore-keys: |
          yun-sdk-${{ hashFiles('yun-sdk-version.txt') }}-${{ runner.os }}-

    - name: Build wheel
      shell: bash
      run: python -m build --wheel --outdir dist

    - name: Fix/validate wheel platform tag
      shell: bash
      run: python scripts/fix_wheel_tag.py dist

    - name: Validate wheel contents
      shell: bash
      run: |
        python - <<'PY'
        import sys
        import zipfile
        from pathlib import Path

        wheels = sorted(Path("dist").glob("*.whl"))
        assert len(wheels) == 1, wheels
        wheel = wheels[0]

        expected = {
            "darwin": "-cp311-cp311-macosx_14_0_arm64.whl",
            "linux": "-cp311-cp311-manylinux_2_28_",
            "win32": "-cp311-cp311-win_amd64.whl",
        }[sys.platform]
        assert expected in wheel.name, wheel.name

        names = zipfile.ZipFile(wheel).namelist()
        extensions = [name for name in names if name.endswith((".so", ".pyd"))]
        assert len(extensions) == 1, extensions
        assert extensions[0].startswith("yunpyopt/_core."), extensions
        print("wheel ok:", wheel)
        PY
        python -m twine check dist/*.whl

    - name: Smoke test wheel in clean venv
      shell: bash
      run: |
        WORK=$(mktemp -d)
        python -m venv "$WORK/venv"
        VENV_PY="$WORK/venv/bin/python"
        if [ -x "$WORK/venv/Scripts/python.exe" ]; then
          VENV_PY="$WORK/venv/Scripts/python.exe"
        fi
        "$VENV_PY" -m pip install --no-cache-dir dist/*.whl
        "$VENV_PY" - <<'PY'
        import shutil
        import tempfile
        from pathlib import Path

        from yunpyopt import __version__, solve

        case = Path(tempfile.mkdtemp()) / "c1_2_1"
        shutil.copytree("tests/data/c1_2_1", case, ignore=shutil.ignore_patterns("output"))
        result = solve(case, log_level="warning")
        assert result["loads"] and Path(result["loads"]).is_file(), result
        assert result["plan_summary"] and Path(result["plan_summary"]).is_file(), result
        print("version:", __version__)
        print(result)
        PY

    - name: Check dynamic dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        WORK=$(mktemp -d)
        python -m zipfile -e dist/*.whl "$WORK/wheel"
        so=$(find "$WORK/wheel" -name '_core*.so' -print -quit)
        bad=$(otool -L "$so" | tail -n +2 | grep -v -E '(/usr/lib/|/System/Library/)' || true)
        if [ -n "$bad" ]; then echo "非系统依赖:"; echo "$bad"; exit 1; fi
        if otool -l "$so" | grep -q LC_RPATH; then echo "存在 LC_RPATH"; exit 1; fi
        echo "dylib deps ok"

    - name: Check manylinux policy (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        python -m auditwheel show dist/*.whl | tee "$RUNNER_TEMP/auditwheel.txt"
        grep -q "manylinux_2_28" "$RUNNER_TEMP/auditwheel.txt"
        WORK=$(mktemp -d)
        python -m zipfile -e dist/*.whl "$WORK/wheel"
        so=$(find "$WORK/wheel" -name '_core*.so' -print -quit)
        if readelf -d "$so" | grep -q 'libstdc++'; then
          echo "wheel 仍依赖外部 libstdc++，请检查 -static-libstdc++ 链接"; exit 1
        fi
        if readelf -d "$so" | grep -qE 'RPATH|RUNPATH'; then
          echo "wheel 存在 RPATH/RUNPATH"; exit 1
        fi
        echo "manylinux deps ok"

    - name: Check dynamic dependencies (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        WORK=$(mktemp -d)
        python -m zipfile -e dist/*.whl "$WORK/wheel"
        pyd=$(find "$WORK/wheel" -name '_core*.pyd' -print -quit)
        MSYS_NO_PATHCONV=1 dumpbin /dependents "$pyd" > "$WORK/deps.txt"
        cat "$WORK/deps.txt"
        python - "$WORK/deps.txt" <<'PY'
        import re
        import sys
        from pathlib import Path

        text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
        deps = sorted(set(re.findall(r"[A-Za-z0-9_.-]+\.dll", text)))
        allowed = {
            "KERNEL32.dll",
            "MSVCP140.dll",
            "VCRUNTIME140.dll",
            "VCRUNTIME140_1.dll",
            "python311.dll",
            "ucrtbase.dll",
        }
        bad = [
            name
            for name in deps
            if name not in allowed and not name.lower().startswith("api-ms-win-")
        ]
        if bad:
            raise SystemExit(f"意外的 DLL 依赖: {bad}")
        print("dll deps ok:", deps)
        PY

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/*.whl
